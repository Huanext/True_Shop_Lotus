<title>รวม Dashboard</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8;
    --text: #e2e8f0; --text-dim: #94a3b8; --border: #334155;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; white-space:nowrap; }
  #search { flex:1; min-width:160px; max-width:320px; padding:7px 12px; border-radius:6px; border:1px solid var(--border); background:#0f172a; color:var(--text); font-size:13px; }
  nav { display:flex; gap:8px; overflow-x:auto; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); }
  nav::-webkit-scrollbar { height:7px; }
  nav::-webkit-scrollbar-track { background:var(--panel); }
  nav::-webkit-scrollbar-thumb { background:var(--accent); border-radius:4px; }
  nav { scrollbar-color: var(--accent) var(--panel); scrollbar-width: thin; }
  .tab-btn { flex:0 0 auto; padding:9px 16px; border-radius:8px; border:1px solid #475569; background:#28374f; color:var(--text); font-size:13px; font-weight:500; cursor:pointer; white-space:nowrap; transition:all .15s ease; }
  .tab-btn:hover { color:#fff; border-color:var(--accent); background:#334357; }
  .tab-btn.active { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:700; box-shadow:0 0 0 1px var(--accent), 0 2px 10px rgba(56,189,248,.5); }
  main { flex:1; position:relative; background:#fff; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:none; display:none; background:#fff; }
  iframe.active { display:block; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:13px; background:var(--bg); }
</style>

  const tabbar = document.getElementById('tabbar');
  const main = document.getElementById('main');
  const loading = document.getElementById('loading');
  const search = document.getElementById('search');
  const iframeCache = {};
  let activeIndex = null;

  async function b64ToBlobUrl(b64, gz) {
    const byteChars = atob(b64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    let byteArray = new Uint8Array(byteNumbers);
    if (gz && typeof DecompressionStream !== 'undefined') {
      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      writer.write(byteArray);
      writer.close();
      byteArray = new Uint8Array(await new Response(ds.readable).arrayBuffer());
    }
    const blob = new Blob([byteArray], { type: 'text/html;charset=utf-8' });
    return URL.createObjectURL(blob);
  }

  async function showTab(index) {
    if (activeIndex === index) return;
    Object.values(iframeCache).forEach(f => f.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    const activeBtn = document.getElementById('tab-btn-' + index);
    activeBtn.classList.add('active');
    activeBtn.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
    if (!iframeCache[index]) {
      loading.style.display = 'flex';
      const url = await b64ToBlobUrl(DASHBOARDS[index].b64, DASHBOARDS[index].gz);
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.onload = () => { loading.style.display = 'none'; };
      main.appendChild(iframe);
      iframeCache[index] = iframe;
    } else {
      loading.style.display = 'none';
    }
    iframeCache[index].classList.add('active');
    activeIndex = index;
  }

  function renderTabs(filter) {
    tabbar.innerHTML = '';
    DASHBOARDS.forEach((d, i) => {
      if (filter && !d.title.toLowerCase().includes(filter.toLowerCase())) return;
      const btn = document.createElement('button');
      btn.className = 'tab-btn';
      btn.id = 'tab-btn-' + i;
      btn.textContent = d.title;
      btn.onclick = () => showTab(i);
      tabbar.appendChild(btn);
    });
    if (activeIndex !== null) {
      const activeBtn = document.getElementById('tab-btn-' + activeIndex);
      if (activeBtn) activeBtn.classList.add('active');
    }
  }

  search.addEventListener('input', (e) => renderTabs(e.target.value));
  renderTabs('');
  if (DASHBOARDS.length > 0) showTab(0); else loading.textContent = 'ไม่มี Dashboard';
</script>
